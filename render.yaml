# Render free-tier blueprint. Push this repo to GitHub, then in Render:
# New -> Blueprint -> select this repo -> Apply. This provisions a free
# Postgres database and a free web service for the FastAPI backend.
databases:
  - name: syncsupply-db
    plan: free
    databaseName: syncsupply
    user: syncsupply

services:
  - type: web
    name: syncsupply-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: syncsupply-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app,http://localhost:5173
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
